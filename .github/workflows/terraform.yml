name: Terraform LAB IaC

on:
  pull_request:
    branches: [develop]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  push:
    branches: [develop]
    paths: ["infra/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:
    inputs:
      action:
        description: "apply o destroy"
        type: choice
        options: [apply, destroy]
        default: apply
      confirm:
        description: "Para destroy escribir DESTROY"
        type: string
        required: false

permissions:
  contents: read
  id-token: write # necesario para OIDC

concurrency:
  group: terraform-lab-iac
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.10.5
  TF_IN_AUTOMATION: "true"
  TF_VAR_bucket_name: ${{ vars.LAB_BUCKET_NAME }}
  TF_VAR_http_cidr: ${{ vars.LAB_HTTP_CIDR }}

defaults:
  run:
    working-directory: infra

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  apply:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC (temporal)
        uses: actions/github-script@v7
        with:
          script: |
            const t = await core.getIDToken('sts.amazonaws.com');
            const c = JSON.parse(Buffer.from(t.split('.')[1], 'base64').toString());
            core.info('sub: ' + c.sub);
            core.info('aud: ' + c.aud);

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"
      - run: terraform fmt -check -recursive
      - run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -out=tfplan
          {
            echo "## Terraform plan"
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: terraform apply -input=false tfplan

      - name: Outputs
        run: |
          {
            echo "## Outputs"
            echo '```'
            terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  destroy:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - name: Confirmación
        working-directory: .
        run: |
          if [ "${{ inputs.confirm }}" != "DESTROY" ]; then
            echo "::error::Para destruir hay que escribir DESTROY en confirm"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - run: terraform init -input=false -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      - name: Plan destroy
        run: |
          terraform plan -destroy -input=false -out=destroy.tfplan
          {
            echo "## Plan de destrucción"
            echo '```'
            terraform show -no-color destroy.tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: terraform apply -input=false destroy.tfplan
